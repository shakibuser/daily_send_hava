name: Daily Weather Report

on:
  schedule:
    # ساعت 04:00 UTC = 07:30 تهران؛ اسکریپت خودش تا 08:00 صبر می‌کند
    # (برای جبران تاخیرهای معمول GitHub Actions)
    - cron: "0 4 * * *"
  workflow_dispatch: {}   # اجرای دستی برای تست (بدون انتظار تا ساعت 8)

permissions:
  contents: read

jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send weather report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@saba_rasanehh"
        run: python weather_post.py
